name: MedInfo CD

on:
  workflow_run:
    workflows:
      - MedInfo CI
    types:
      - completed

jobs:
  deploy:

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT: production

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      ####################################################
      # CONFIG SERVER
      ####################################################

      - name: Redeploy Config Server
        run: |
          echo "Deploying Config Server..."
          railway redeploy \
            --project $RAILWAY_PROJECT_ID \
            --environment $RAILWAY_ENVIRONMENT \
            --service config-server \
            --from-source \
            --yes

      - name: Wait for Config Server
        run: sleep 30

      ####################################################
      # EUREKA SERVER
      ####################################################

      - name: Redeploy Eureka Server
        run: |
          echo "Deploying Eureka Server..."
          railway redeploy \
            --project $RAILWAY_PROJECT_ID \
            --environment $RAILWAY_ENVIRONMENT \
            --service eureka-server \
            --from-source \
            --yes

      - name: Wait for Eureka Server
        run: sleep 30

      ####################################################
      # AUTH SERVICE
      ####################################################

      - name: Redeploy Auth Service
        run: |
          echo "Deploying Auth Service..."
          railway redeploy \
            --project $RAILWAY_PROJECT_ID \
            --environment $RAILWAY_ENVIRONMENT \
            --service auth-service \
            --from-source \
            --yes

      ####################################################
      # MEDICAL SERVICE
      ####################################################

      - name: Redeploy Medical Service
        run: |
          echo "Deploying Medical Service..."
          railway redeploy \
            --project $RAILWAY_PROJECT_ID \
            --environment $RAILWAY_ENVIRONMENT \
            --service medical-service \
            --from-source \
            --yes

      ####################################################
      # AUDIT SERVICE
      ####################################################

      - name: Redeploy Audit Service
        run: |
          echo "Deploying Audit Service..."
          railway redeploy \
            --project $RAILWAY_PROJECT_ID \
            --environment $RAILWAY_ENVIRONMENT \
            --service audit-service \
            --from-source \
            --yes

      - name: Wait for Backend Services
        run: sleep 60

      ####################################################
      # GATEWAY SERVICE
      ####################################################

      - name: Redeploy Gateway Service
        run: |
          echo "Deploying Gateway Service..."
          railway redeploy \
            --project $RAILWAY_PROJECT_ID \
            --environment $RAILWAY_ENVIRONMENT \
            --service gateway-service \
            --from-source \
            --yes

      ####################################################
      # COMPLETED
      ####################################################

      - name: Deployment Complete
        run: |
          echo "========================================"
          echo "✅ MedInfo Deployment Completed"
          echo "========================================"